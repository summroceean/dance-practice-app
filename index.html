<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안무 유사도 분석기 (TensorFlow.js + Google Sheets)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        h1 { text-align: center; }
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 400px; }
        video { width: 100%; border-radius: 4px; background: #000; margin-top: 10px; }
        .control-panel { text-align: center; margin-top: 20px; }
        button { background: #4f46e5; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #4338ca; }
        button:disabled { background: #a5b4fc; cursor: not-allowed; }
        #result-box { text-align: center; font-size: 24px; font-weight: bold; margin-top: 20px; color: #4f46e5; }
        
        /* 점수 저장 패널 스타일 */
        #save-panel {
            display: none; /* 분석 완료 후 표시 */
            background: white;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        #save-panel input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        #save-btn { background: #10b981; margin-top: 5px; }
        #save-btn:hover { background: #059669; }
        #save-status { margin-top: 10px; font-size: 14px; color: #555; }

        /* 반응형 모바일 대응 */
        @media(max-width: 850px) {
            .container { flex-direction: column; align-items: center; }
            .box, #save-panel { width: 100%; max-width: 400px; box-sizing: border-box; }
        }
    </style>

    <!-- TensorFlow.js 및 MoveNet 필수 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>

    <h1>댄스 유사도 분석 (브라우저 AI)</h1>

    <div class="container">
        <!-- 원본 영상 영역 -->
        <div class="box">
            <h3>1. 원본 안무 영상</h3>
            <input type="file" id="ref-video-file" accept="video/*"><br>
            <video id="ref-video" controls muted playsinline></video>
        </div>

        <!-- 내 연습 영상 영역 -->
        <div class="box">
            <h3>2. 내 연습 영상</h3>
            <input type="file" id="user-video-file" accept="video/*"><br>
            <video id="user-video" controls muted playsinline></video>
        </div>
    </div>

    <div class="control-panel">
        <button id="analyze-btn">유사도 분석 시작</button>
        <div id="result-box">분석 대기 중...</div>
    </div>

    <!-- 분석 완료 후 나타나는 구글 시트 저장 창 -->
    <div id="save-panel">
        <h4>📊 연습 기록 저장하기</h4>
        <p style="font-size: 14px; color: #666;">같은 곡 이름으로 입력하면 나중에 그래프로 묶어볼 수 있습니다.</p>
        <input type="text" id="group-name-input" placeholder="예: 뉴진스 - Super Shy">
        <br>
        <button id="save-btn">구글 시트에 저장하기</button>
        <div id="save-status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
